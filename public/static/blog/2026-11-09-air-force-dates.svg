<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="320" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="44" font-size="18" font-weight="500" fill="#1f2937">两个 11 月 9 日，两个 11 月 11 日</text>
    <text x="40" y="68" font-size="13" fill="#6b7280">1949 年成立流程 / 2026 年 77 周年节点</text>

    <text x="40" y="136" font-size="14" font-weight="500" fill="#2563eb">1949</text>
    <line x1="110" y1="130" x2="860" y2="130" stroke="#d1d5db" stroke-width="1"/>
    <path d="M350 130 L620 130" fill="none" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arr1)"/>
    <circle cx="330" cy="130" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="106" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">11 月 9 日</text>
    <text x="330" y="158" font-size="12" fill="#6b7280" text-anchor="middle">聂荣臻报告，毛泽东批准</text>
    <circle cx="640" cy="130" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="640" y="106" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">11 月 11 日</text>
    <text x="640" y="158" font-size="12" fill="#6b7280" text-anchor="middle">中央军委通电宣布空军司令部成立</text>

    <text x="40" y="246" font-size="14" font-weight="500" fill="#c2410c">2026</text>
    <line x1="110" y1="240" x2="860" y2="240" stroke="#d1d5db" stroke-width="1"/>
    <path d="M270 240 L480 240" fill="none" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arr2)"/>
    <path d="M520 240 L740 240" fill="none" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arr2)"/>
    <circle cx="250" cy="240" r="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
    <text x="250" y="216" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">11 月 9 日</text>
    <text x="250" y="268" font-size="12" fill="#6b7280" text-anchor="middle">04:24 发射低轨 29 组</text>
    <circle cx="500" cy="240" r="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
    <text x="500" y="216" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">11 月 11 日</text>
    <text x="500" y="268" font-size="12" fill="#6b7280" text-anchor="middle">成立 77 周年正日</text>
    <circle cx="760" cy="240" r="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
    <text x="760" y="216" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">12 月 7–13 日</text>
    <text x="760" y="268" font-size="12" fill="#6b7280" text-anchor="middle">第十六届中国航展 · 珠海</text>

    <text x="40" y="302" font-size="12" fill="#6b7280">1986 年 10 月 28 日，中央军委正式确定 11 月 11 日为中国人民解放军空军成立日</text>
  </g>
</svg>
