    <text x="77" y="155" font-size="13" font-weight="500" fill="#0c447c" text-anchor="middle">18、19</text>
    <text x="152" y="155" font-size="13" fill="#9ca3af" text-anchor="middle">—</text>
    <text x="226" y="155" font-size="13" font-weight="500" fill="#0c447c" text-anchor="middle">20</text>
    <text x="301" y="155" font-size="13" font-weight="500" fill="#0c447c" text-anchor="middle">21</text>
    <text x="375" y="155" font-size="13" fill="#9ca3af" text-anchor="middle">—</text>
    <text x="450" y="155" font-size="13" font-weight="500" fill="#0c447c" text-anchor="middle">22</text>
    <text x="524" y="155" font-size="13" fill="#9ca3af" text-anchor="middle">—</text>
    <text x="599" y="155" font-size="13" font-weight="500" fill="#0c447c" text-anchor="middle">23、24</text>
    <text x="673" y="155" font-size="13" font-weight="500" fill="#9a3412" text-anchor="middle">25、26</text>
    <text x="748" y="155" font-size="13" font-weight="500" fill="#9a3412" text-anchor="middle">27、28</text>
    <text x="822" y="155" font-size="13" font-weight="500" fill="#9a3412" text-anchor="middle">29</text>

    <text x="40" y="224" font-size="12" fill="#6b7280">最近四次：9 月 23 日 → 10 月 10 日 → 10 月 25 日 → 11 月 9 日，间隔 17、15、15 天</text>
    <text x="40" y="248" font-size="12" fill="#6b7280">火箭以长征十二号与长征八号甲轮换；21 组例外，4 月 9 日在太原用长征六号改</text>
    <text x="40" y="272" font-size="12" fill="#6b7280">航天科技集团五院 2026 年低轨卫星发射任务在 29 组收官</text>
