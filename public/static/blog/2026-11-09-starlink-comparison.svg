<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <rect x="0" y="0" width="900" height="340" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="44" font-size="18" font-weight="500" fill="#1f2937">与 Starlink 的规模差距</text>
    <text x="40" y="68" font-size="13" fill="#6b7280">同一线性刻度；Starlink 为在轨编目，国网为累计发射估算，口径不同</text>

    <text x="40" y="104" font-size="13" font-weight="500" fill="#374151">在轨 / 累计发射（颗）</text>
    <text x="40" y="136" font-size="13" fill="#1f2937">Starlink</text>
    <rect x="200" y="122" width="560" height="20" rx="3" fill="#2563eb"/>
    <text x="775" y="136" font-size="13" fill="#1f2937">11,214</text>
    <text x="40" y="170" font-size="13" fill="#1f2937">国网 GW</text>
    <rect x="200" y="156" width="12" height="20" rx="2" fill="#c2410c"/>
    <text x="775" y="170" font-size="13" fill="#1f2937">≈240</text>

    <text x="40" y="212" font-size="13" font-weight="500" fill="#374151">2026 年发射入轨（颗）</text>
    <text x="40" y="244" font-size="13" fill="#1f2937">Starlink</text>
    <rect x="200" y="230" width="113" height="20" rx="3" fill="#2563eb"/>
    <text x="775" y="244" font-size="13" fill="#1f2937">≈2,270</text>
    <text x="40" y="278" font-size="13" fill="#1f2937">国网 GW</text>
    <rect x="200" y="264" width="6" height="20" rx="2" fill="#c2410c"/>
    <text x="775" y="278" font-size="13" fill="#1f2937">≈110</text>

    <text x="40" y="312" font-size="12" fill="#6b7280">Starlink 为轨道编目与年度发射数；国网按组数 × 每组约 9 星估算，两者不可作精确比值</text>
  </g>
</svg>
